# Checks on every push (migration plan, block 8.3). No secrets, no database.
name: Comprobar
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Install tools (exact versions from package-lock.json)
        run: npm ci
      - name: The bundle of src/app is up to date (src/generated/core.js, the lazy chunks and their manifest)
        run: npm run build:core && git diff --exit-code src/generated src/app/core/lazy/manifest.ts && test -z "$(git status --porcelain src/generated src/app/core/lazy)"
      - name: Build, types (new and legacy code) and lint
        run: npm run check
      - name: External libraries pinned with a correct integrity hash
        run: node herramientas/dependencias.mjs
