# Checks on every push (migration plan, block 8.3). No secrets, no database.
name: Comprobar
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install tools (exact versions from package-lock.json)
        run: npm ci
      - name: The bundle of src/app is up to date (src/generated/core.js)
        run: npm run build:core && git diff --exit-code src/generated/core.js
      - name: Build, types (new and legacy code) and lint
        run: npm run check
      - name: External libraries pinned with a correct integrity hash
        run: node herramientas/dependencias.mjs
