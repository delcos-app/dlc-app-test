# Pruebas de seguridad en cada push (plan de migración, 9.4). Sin secretos ni base de datos.
#   - secretos escritos en el código o en la historia (gitleaks, binario fijado por versión y suma sha256);
#   - dependencias de la app con fallos conocidos (npm audit; la app no tiene dependencias de producción: solo informa);
#   - librerías de CDN con versión exacta y huella de integridad (herramientas/dependencias.mjs falla si falta una);
#   - la política de seguridad (CSP) está y cubre lo necesario (construir --comprobar).
name: Seguridad
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seguridad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v4.4.0 y actions/setup-node v4.4.0, fijadas por su commit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
      - name: Secretos (gitleaks 8.30.1)
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          # Las claves anon de config.js son públicas por diseño: se ignoran por su regla (jwt) solo en ese archivo
          cat > .gitleaks-ci.toml <<'FIN'
          [extend]
          useDefault = true
          [allowlist]
          paths = ['''^config\.js$''', '''^min/''', '''\.map$''', '''^jspdf\.umd\.min\.js$''', '''^qrcode\.js$''']
          FIN
          # Los archivos tal como están (la historia antigua no se revisa aquí: un hallazgo viejo pararía todos los push;
          # para revisarla una vez, a mano: ./gitleaks git --config .gitleaks-ci.toml --redact .)
          ./gitleaks dir --config .gitleaks-ci.toml --redact --no-banner --exit-code 1 .
      - name: Herramientas (versiones exactas de package-lock.json)
        run: npm ci
      - name: Dependencias con fallos conocidos
        shell: bash
        run: |
          # Solo hay dependencias de desarrollo (no llegan a la app publicada): se informa sin parar el flujo
          npm audit --omit=dev --audit-level=high || echo "::warning::npm audit encuentra fallos en dependencias de producción"
          npm audit --audit-level=high || echo "::notice::Hay fallos conocidos en herramientas de desarrollo; revisarlos en la revisión mensual (docs/dependencias.md)"
      - name: Librerías de CDN con versión exacta y huella correcta
        run: node herramientas/dependencias.mjs
      - name: Construcción con la política de seguridad y el presupuesto de peso
        run: npm run build:core && node herramientas/construir.mjs --comprobar
